appId: com.digitalcamerahd.camera4k.selfiecamera
name: Every screen of the design opens
---
- launchApp
- tapOn:
    id: "btnSkip"
    optional: true
- tapOn:
    id: "btnContinue"
    optional: true
- tapOn:
    id: "btnNotNow"
    optional: true

# Home is the root now, so the camera is one tap further in. Optional, so the flow still
# runs if it is started from somewhere that is already in a viewfinder.
- tapOn:
    id: "btnOpenCamera"
    optional: true

- tapOn: "Pro"
- assertVisible:
    id: "isoDial"
- back

- tapOn: "Video"
- assertVisible:
    id: "btnRecord"
- back

- tapOn:
    id: "btnSettings"
- assertVisible: "Settings"
- assertVisible: "Grid overlay"
- back

- tapOn:
    id: "btnLastShot"
- assertVisible: "Gallery"
- tapOn:
    id: "navSettings"
- assertVisible: "Photo resolution"
