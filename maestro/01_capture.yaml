appId: com.digitalcamerahd.camera4k.selfiecamera
name: Shutter completes without crashing
---
# Clearing state under a process that is still shutting down makes the first screen
# arrive late, so wait for it rather than tapping into nothing.
- stopApp
- launchApp:
    clearState: true
    permissions:
      all: allow

# Onboarding, then straight to the viewfinder.
- extendedWaitUntil:
    visible:
      id: "btnSkip"
    timeout: 15000
- tapOn:
    id: "btnSkip"
- tapOn:
    id: "btnContinue"
- tapOn:
    id: "btnNotNow"

# Home is the root now, so the camera is one tap further in. Optional, so the flow still
# runs if it is started from somewhere that is already in a viewfinder.
- tapOn:
    id: "btnOpenCamera"
    optional: true
- extendedWaitUntil:
    visible:
      id: "btnShutter"
    timeout: 15000

- tapOn:
    id: "btnShutter"

# If the capture crashed the process, none of this would still be on screen.
- extendedWaitUntil:
    visible:
      id: "btnShutter"
    timeout: 15000
- assertVisible:
    id: "btnLastShot"
- assertVisible:
    id: "modeRow"
