appId: com.example.hd_camera
name: Both viewfinders carry the quick-zoom row and report the ratio
---
# No clearState: this flow is meant for a real phone, so the zoom steps on screen are the
# ones that camera actually has.
- stopApp
- launchApp
- tapOn:
    id: "btnSkip"
    optional: true
- tapOn:
    id: "btnContinue"
    optional: true
- tapOn:
    id: "btnNotNow"
    optional: true

# Home is the root now, so the camera is one tap further in. Optional, so the flow still
# runs if it is started from somewhere that is already in a viewfinder.
- tapOn:
    id: "btnOpenCamera"
    optional: true

- extendedWaitUntil:
    visible:
      id: "btnShutter"
    timeout: 15000

# A camera with no zoom at all has no row to show, so the assertions only run where one is.
# Pinch itself is out of reach here: Maestro drives one finger.
#
# tvZoomRatio is deliberately not asserted. It is on screen for under a second by design,
# and Maestro's first look at the hierarchy arrives after it has already faded, so the
# assertion failed on a device where the readout was demonstrably working. What the
# readout does is verified by hand; what this flow can hold the app to is that the chips
# come from the camera and that tapping one leaves the viewfinder alive.
- runFlow:
    when:
      visible:
        id: "zoomChips"
    commands:
      - tapOn: "1×"
      - assertVisible:
          id: "btnShutter"
      # Swiping up off the row brings the wheel over the picture. Holding a chip does
      # the same, but a long press is not something Maestro delivers to a view reliably,
      # so the gesture this can actually drive is the one it checks.
      - swipe:
          from:
            id: "zoomChips"
          direction: UP
          duration: 400
      - assertVisible:
          id: "zoomArc"
      - assertVisible:
          id: "btnShutter"

- tapOn: "Video"
- extendedWaitUntil:
    visible:
      id: "btnRecord"
    timeout: 15000

- runFlow:
    when:
      visible:
        id: "zoomChips"
    commands:
      - tapOn: "1×"
      - assertVisible:
          id: "btnRecord"

# Holding a chip opens the wheel. Maestro cannot drag an arc, so what this can hold the
# app to is that the wheel appears from the gesture, that it carries the ratio, and that
# the viewfinder is still there underneath it afterwards. The drag itself is by hand.
- runFlow:
    when:
      visible:
        id: "zoomChips"
    commands:
      - swipe:
          from:
            id: "zoomChips"
          direction: UP
          duration: 400
      - assertVisible:
          id: "zoomArc"
      - assertVisible:
          id: "btnRecord"

# The zoom row must not break recording: the clip still starts, pauses and stops.
- tapOn:
    id: "btnRecord"
- extendedWaitUntil:
    visible:
      id: "btnPauseResume"
    timeout: 8000
- runFlow:
    when:
      visible:
        id: "zoomChips"
    commands:
      - tapOn: "1×"
- tapOn:
    id: "btnRecord"
- extendedWaitUntil:
    visible:
      id: "btnLastShot"
    timeout: 15000
- assertVisible:
    id: "modeRow"
