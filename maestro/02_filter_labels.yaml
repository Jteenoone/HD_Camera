appId: com.example.hd_camera
name: Filter swatches and their labels are readable
---
- launchApp
- tapOn:
    id: "btnSkip"
    optional: true
- tapOn:
    id: "btnContinue"
    optional: true
- tapOn:
    id: "btnNotNow"
    optional: true

# Home is the root now, so the camera is one tap further in. Optional, so the flow still
# runs if it is started from somewhere that is already in a viewfinder.
- tapOn:
    id: "btnOpenCamera"
    optional: true

- tapOn: "Beauty"
- assertVisible: "Live filters"

# Every swatch label the design lists must be on screen.
- assertVisible: "None"
- assertVisible: "Vivid"
- assertVisible: "Fade"
- assertVisible: "B&W"
- assertVisible: "Warm"

# The strength readout stands in for the slider: Material's Slider only publishes
# virtual accessibility nodes, so the view's own id never reaches the hierarchy.
- assertVisible:
    id: "tvStrength"
- assertVisible:
    id: "filterRow"

- tapOn: "B&W"
- assertVisible: "B&W"
- assertVisible:
    id: "btnShutter"
