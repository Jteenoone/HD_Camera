appId: com.digitalcamerahd.camera4k.selfiecamera
name: Shutter survives a RAW + JPEG capture (keeps existing app data)
---
# No clearState here: this flow is meant for a real phone, so the user's
# settings and photos stay untouched.
# Start from a fresh activity: the app may have been left on another screen.
- stopApp
- launchApp
- tapOn:
    id: "btnSkip"
    optional: true
- tapOn:
    id: "btnContinue"
    optional: true
- tapOn:
    id: "btnNotNow"
    optional: true

# Home is the root now, so the camera is one tap further in. Optional, so the flow still
# runs if it is started from somewhere that is already in a viewfinder.
- tapOn:
    id: "btnOpenCamera"
    optional: true
- assertVisible:
    id: "btnShutter"

- tapOn:
    id: "btnShutter"

- extendedWaitUntil:
    visible:
      id: "btnShutter"
    timeout: 20000
- assertVisible:
    id: "modeRow"
